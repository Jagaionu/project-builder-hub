name: Ingest Knowledge Base

# Embeds docs/kb into ai_knowledge_chunks whenever the KB changes on main, and
# on demand. Requires repo secrets: OPENAI_API_KEY, SUPABASE_URL,
# SUPABASE_SERVICE_ROLE_KEY (Settings → Secrets and variables → Actions).
on:
  push:
    branches: [main]
    paths:
      - "docs/kb/**"
      - "scripts/ingest-knowledge.ts"
  workflow_dispatch:

concurrency:
  group: ingest-knowledge
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Ingest knowledge base
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/ingest-knowledge.ts
